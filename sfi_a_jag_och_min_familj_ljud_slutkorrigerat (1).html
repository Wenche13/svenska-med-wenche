let currentUtterance=null;
function speak(text){
  const phrase=String(text??'').trim();
  const status=document.getElementById('audioStatus');
  if(!phrase){if(status)status.textContent='Det finns ingen text att läsa upp.';return;}
  if(!('speechSynthesis' in window)){
    if(status)status.textContent='Uppläsning stöds inte i denna webbläsare. Prova Chrome eller Edge.';
    return;
  }
  const synth=window.speechSynthesis;
  synth.cancel();
  const utterance=new SpeechSynthesisUtterance(phrase);
  currentUtterance=utterance;
  utterance.lang='sv-SE';
  utterance.rate=0.82;
  utterance.pitch=1;
  const voices=synth.getVoices();
  const swedish=voices.find(v=>v.lang.toLowerCase()==='sv-se')
     ||voices.find(v=>v.lang.toLowerCase().startsWith('sv'));
  if(swedish)utterance.voice=swedish;
  if(status)status.textContent='🔊 Lyssna: '+phrase;
  utterance.onerror=e=>{
    if(e.error!=='interrupted' && e.error!=='canceled' && status)
      status.textContent='Ljudet kunde inte spelas upp. Kontrollera ljudet på datorn och prova Chrome eller Edge.';
  };
  // Speak directly from the click handler, never via delayed callbacks.
  synth.speak(utterance);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function move(d){if('speechSynthesis' in window)window.speechSynthesis.cancel();if(tab===5)writings[idx]=writing;idx=Math.max(0,Math.min(count()-1,idx+d));chosen='';checked=false;sentence=[];writing=writings[idx]||'';render()}
function count(){return tab===0?words.length:6}
function mark(ok){results[tab][idx]=ok}
function progress(){return '<div class="progress">'+Array.from({length:count()},(_,i)=>'<span class="dot '+(results[tab][i]?'done':'')+'"></span>').join('')+'</div>'}

if(tab===1){let x=reads[idx];html+=`<p>Läs texten. Svara på frågan.</p><div class="example"><strong>${esc(x.text)}</strong> <button class="secondary" onclick='speak(${JSON.stringify(x.text)})'>🔊 Lyssna på texten</button></div><div class="question"><h3>${esc(x.q)}</h3><div class="choices">${x.opts.map((o,i)=>`<button class="choice ${chosen===String(i)?'selected':''}" onclick="choose('${i}')">${esc(o)}</button>`).join('')}</div><button class="primary" onclick="checkChoice('${x.ans}')">Kontrollera svar</button><div class="feedback" id="fb"></div></div>`}
if(tab===2){let x=listens[idx];html+=`<p>Tryck på ljudknappen. Lyssna. Välj rätt svar.</p><div class="question"><button class="primary" onclick='speak(${JSON.stringify(x.say)})'>🔊 Lyssna på meningen</button><h3>${esc(x.q)}</h3><div class="choices">${x.opts.map((o,i)=>`<button class="choice ${chosen===String(i)?'selected':''}" onclick="choose('${i}')">${esc(o)}</button>`).join('')}</div><button class="primary" onclick="checkChoice('${x.ans}')">Kontrollera svar</button><div class="feedback" id="fb"></div></div><div class="note">💡 Du kan lyssna flera gånger. Ljudet läses upp av din webbläsare.</div>`}
if(tab===3){let x=builds[idx];if(!available.length||available.join('|')!==x.join('|'))available=[...x];let pool=x.map((w,i)=>({w,i})).sort((a,b)=>(a.i*7+idx*3)%x.length-(b.i*7+idx*3)%x.length);html+=`<p>Tryck på orden i rätt ordning. Bygg en mening.</p><div class="question"><h3>Din mening:</h3><div class="sentence">${sentence.map((w,i)=>`<button class="word" onclick="removeWord(${i})">${esc(w.w)} ✕</button>`).join('')||'<span class="muted">Välj orden här nedanför.</span>'}</div><h3>Välj ord:</h3><div class="choices">${pool.filter(w=>!sentence.some(s=>s.i===w.i)).map(w=>`<button class="word" onclick="addWord(${w.i})">${esc(w.w)}</button>`).join('')}</div><button class="secondary" onclick="speak(sentence.map(x=>x.w).join(' '))">🔊 Lyssna på min mening</button><button class="primary" onclick="checkSentence()">Kontrollera svar</button><button class="secondary" onclick="sentence=[];render()">Börja om</button><div class="feedback" id="fb"></div></div>`}
if(tab===4){html+=`<p>Lyssna och säg meningen högt. Träna gärna med en annan person.</p><div class="question"><h3>${esc(talks[idx])}</h3><button class="primary" onclick='speak(${JSON.stringify(['Jag heter Sara.','Jag bor i Göteborg.','Det här är min mamma.','Jag har en bror.','Min familj är viktig för mig.','Jag tycker om att läsa.'][idx])})'>🔊 Lyssna på exempelmeningen</button><p>Säg meningen med dina egna ord.</p><button class="secondary" onclick="mark(true);document.getElementById('fb').textContent='Bra jobbat! Fortsätt att öva.';document.getElementById('fb').className='feedback good';document.querySelectorAll('.dot')[${idx}].classList.add('done')">✓ Jag har tränat</button><div class="feedback" id="fb"></div></div><div class="note">🗣️ Den här övningen lyssnar inte på din röst. Du kan träna själv eller med en vän. Du väljer själv vad du vill berätta.</div>`}
if(tab===5){html+=`<p>Skriv enkla meningar. Läs dem högt.</p><div class="question"><h3>${esc(writePrompts[idx])}</h3><textarea class="entry" id="writing" rows="5" placeholder="Skriv här …" oninput="writing=this.value">${esc(writing)}</textarea><button class="primary" onclick="saveWriting()">✓ Jag har skrivit</button><button class="secondary" onclick="speak(document.getElementById('writing').value)">🔊 Lyssna på min text</button><div class="feedback" id="fb"></div></div><div class="note">✏️ Din text rättas inte automatiskt. Läs gärna texten tillsammans med en lärare eller någon du känner.</div>`}
html+=`<div class="actions"><button class="secondary" onclick="move(-1)" ${idx===0?'disabled':''}>← Föregående</button>${idx===count()-1?`<button class="primary" onclick="${tab===5?'finish()':`nav(${tab+1})`}">${tab===5?'Se resultat':'Nästa del →'}</button>`:`<button class="primary" onclick="move(1)">Nästa uppgift →</button>`}</div>`;if(tab!==0)html+='<div id="audioStatus" role="status" aria-live="polite" class="note">🔊 Tryck på Lyssna för att höra svenska.</div>';panel.innerHTML=html}
function choose(x){chosen=String(x);document.querySelectorAll('.choice').forEach((b,i)=>b.classList.toggle('selected',tab===0?b.textContent.trim()===chosen:String(i)===chosen))}
function checkChoice(ans){let f=document.getElementById('fb');if(chosen===''){f.textContent='Välj ett svar först.';f.className='feedback bad';return}let ok=chosen===String(ans);mark(ok);f.textContent=ok?'✓ Rätt! Bra jobbat!':'Försök igen. Titta eller lyssna en gång till.';f.className='feedback '+(ok?'good':'bad');if(ok)document.querySelectorAll('.dot')[idx].classList.add('done')}
function addWord(i){sentence.push({w:builds[idx][i],i});render()}
function removeWord(i){sentence.splice(i,1);render()}
function checkSentence(){let ok=sentence.map(x=>x.w).join(' ')===builds[idx].join(' ');mark(ok);let f=document.getElementById('fb');f.textContent=ok?'✓ Rätt mening! Bra jobbat!':'Försök igen. Titta på ordens ordning.';f.className='feedback '+(ok?'good':'bad');if(ok)document.querySelectorAll('.dot')[idx].classList.add('done')}
function saveWriting(){let t=document.getElementById('writing').value.trim();let f=document.getElementById('fb');if(!t){f.textContent='Skriv något först.';f.className='feedback bad';return}mark(true);f.textContent='Bra! Du har skrivit en text. Läs den gärna högt.';f.className='feedback good';document.querySelectorAll('.dot')[idx].classList.add('done')}
function finish(){let n=results.reduce((a,r)=>a+Object.values(r).filter(Boolean).length,0);panel.innerHTML=`<h2>🌷 Bra jobbat!</h2><p class="complete">Du har tränat på Jag och min familj!</p><p>Du har markerat ${n} av 39 uppgifter som klara.</p><p>Du kan göra alla övningarna flera gånger.</p><button class="primary" onclick="nav(0)">Träna igen från början</button><button class="secondary" onclick="window.print()">🖨️ Skriv ut</button>`}
render();
</script></body></html>
