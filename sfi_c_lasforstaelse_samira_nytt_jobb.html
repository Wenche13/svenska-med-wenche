<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Samira börjar på ett nytt jobb | Läsförståelse SFI C</title><style>
:root{--forest:#244b3b;--sage:#dce9df;--cream:#f8f5eb;--ink:#25362e;--line:#d2dcd4;--good:#1c6946;--bad:#934c2b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}header{background:var(--forest);color:white;border-radius:20px;overflow:hidden}header img{width:100%;height:320px;object-fit:cover;object-position:center 44%;display:block}header .intro{padding:22px 28px}h1{font-size:clamp(1.65rem,4vw,2.5rem);line-height:1.2;margin:4px 0 10px}h2{font-size:1.65rem;color:var(--forest);line-height:1.25}h3{color:var(--forest)}.tag{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0}.tab{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;font-weight:700;color:var(--forest);cursor:pointer}.tab.active{background:var(--forest);color:white;border-color:var(--forest)}.tab:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #d2a14b;outline-offset:2px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,34px);min-height:350px}.muted{color:#52665a}.story{background:#f4f8f2;border-left:5px solid #88a58e;padding:18px 24px;border-radius:10px}.story p{margin:0 0 14px}.story p:last-child{margin-bottom:0}.question{border:1px solid var(--line);border-radius:12px;padding:17px;margin:17px 0;background:#fff}.question h3{margin:0 0 10px;font-size:1.08rem}.choices{display:grid;gap:9px}.choice{display:block;text-align:left;width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.choice:hover{background:#f3f7f1}.choice.selected{border-color:var(--forest);background:#e9f2e9}.feedback{padding:10px 12px;border-radius:9px;margin-top:10px;background:#f1f5ef}.feedback.good{color:var(--good);background:#e6f4e9}.feedback.bad{color:var(--bad);background:#fff0e7}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{background:var(--forest);border:2px solid var(--forest);color:#fff;border-radius:10px;padding:11px 19px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:var(--forest)}.btn:disabled{opacity:.45;cursor:not-allowed}.progress{margin:14px 0 0;font-size:.94rem}.bar{height:8px;background:#d6e4d8;border-radius:9px;overflow:hidden;margin-top:6px}.bar span{height:100%;display:block;background:#9bcca5;transition:width .2s}.schedule{border-collapse:collapse;width:100%;max-width:560px;margin:16px 0}.schedule th,.schedule td{border:1px solid #b9cfc0;padding:12px;text-align:left}.schedule th{background:var(--forest);color:#fff}.schedule tr:nth-child(even){background:#f0f6ef}.wordlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.word{background:#f2f6ef;border-radius:10px;padding:10px 14px}textarea{width:100%;min-height:125px;border:2px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical}.note{background:#edf3e9;padding:14px;border-radius:10px}.summary{font-size:1.1rem;font-weight:700;background:var(--sage);border-radius:12px;padding:18px}footer{text-align:center;color:#5b7062;padding:22px;font-size:.9rem}@media(max-width:650px){header img{height:220px}.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.wordlist{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:16px}}

const story=`<div class="story"><p>Samira har nyligen fått jobb på ett äldreboende. Hon är glad eftersom hon länge har velat arbeta med människor. Samtidigt är hon lite nervös. Det är många nya arbetsuppgifter och hon känner inte sina kollegor ännu.</p><p>Den första dagen kommer Samira till arbetsplatsen klockan sju på morgonen. Hennes handledare, Maria, visar henne runt och berättar om dagens arbete. Samira får också ett schema där hon kan se vilka dagar hon ska arbeta.</p><p>Under förmiddagen hjälper Samira till med frukosten och pratar med de äldre. Hon tycker att arbetet är intressant, men ibland är det svårt att förstå vad kollegorna säger eftersom de pratar snabbt.</p><p>På lunchrasten berättar hon det för Maria.</p><p>– Du får gärna fråga när du inte förstår, säger Maria. Det är viktigt att du känner dig trygg här.</p><p>Efter några veckor känner Samira sig säkrare. Hon har lärt sig många nya ord och vågar ställa fler frågor. Hon märker också att det blir lättare att förstå kollegorna.</p><p>Samira är fortfarande trött efter arbetsdagarna, men hon känner sig stolt över sina framsteg.</p></div>`;
const before=[{q:'Var arbetar personerna på bilden, tror du?',opts:['På ett äldreboende','På en flygplats','I en klädaffär']},{q:'Vad kan vara svårt på ett nytt jobb?',opts:['Att lära sig nya arbetsuppgifter','Att känna alla från början','Ingenting är någonsin svårt']},{q:'Vad kan ett arbetsschema visa?',opts:['När man ska arbeta','Vad man ska äta hemma','Vilka böcker man äger']}];
const comprehension=[{q:'Var arbetar Samira?',opts:['På en skola','På ett äldreboende','I en affär'],a:1,why:'I första stycket står det att hon fått jobb på ett äldreboende.'},{q:'Varför är Samira lite nervös?',opts:['Hon har nya arbetsuppgifter och känner inte kollegorna','Hon har glömt sin väska','Hon ska resa bort'],a:0,why:'Det är mycket som är nytt för henne.'},{q:'Vem visar Samira runt?',opts:['En granne','En boende','Handledaren Maria'],a:2,why:'Maria är hennes handledare.'},{q:'Vad är svårt för Samira under förmiddagen?',opts:['Att hitta lunchrummet','Att förstå kollegor som pratar snabbt','Att läsa sitt namn'],a:1,why:'Hon har ibland svårt att förstå kollegorna när de pratar snabbt.'},{q:'Vad händer efter några veckor?',opts:['Hon blir säkrare och vågar fråga mer','Hon slutar på jobbet','Hon arbetar aldrig mer'],a:0,why:'Texten berättar att Samira känner sig säkrare och vågar ställa fler frågor.'},{q:'Hur känner Samira sig i slutet?',opts:['Bara arg','Helt uttråkad','Trött men stolt'],a:2,why:'Hon är trött efter arbetet men stolt över sina framsteg.'}];
const schedule=[{q:'Vilken dag är Samira ledig?',opts:['Måndag','Onsdag','Fredag'],a:1,why:'I schemat står det ”Ledig” på onsdagen.'},{q:'När börjar Samira på fredagen?',opts:['07.00','08.00','09.00'],a:2,why:'På fredagen arbetar hon 09.00–17.00.'},{q:'Hur många dagar arbetar hon den här veckan?',opts:['Tre','Fyra','Fem'],a:1,why:'Hon arbetar måndag, tisdag, torsdag och fredag.'},{q:'Vilka dagar börjar hon klockan sju?',opts:['Måndag och torsdag','Tisdag och fredag','Onsdag och fredag'],a:0,why:'Både måndag och torsdag börjar arbetet 07.00.'}];
const inference=[{q:'Varför säger Maria att Samira gärna får fråga?',opts:['För att Samira ska känna sig trygg','För att Samira alltid kommer sent','För att Maria vill slippa arbeta'],a:0,why:'Maria vill att Samira ska känna sig trygg och få stöd.'},{q:'Vad kan vi förstå om Samiras svenska?',opts:['Hon lär sig bara genom böcker','Hon utvecklar språket när hon använder det på jobbet','Hon behöver aldrig öva svenska'],a:1,why:'Hon lär sig nya ord och förstår kollegorna bättre med tiden.'},{q:'Varför är Samira trött men stolt?',opts:['Hon vill inte arbeta','Hon har glömt sitt schema','Arbetet kräver energi, men hon märker att hon utvecklas'],a:2,why:'Det är ansträngande att börja ett nytt jobb, men Samira gör framsteg.'}];
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function questionBlock(items,prefix,practice=false){return items.map((it,i)=>{const key=prefix+i;const val=selections[key];let fb='';if(!practice&&val!==undefined){const correct=val===it.a;fb=`<div class="feedback ${correct?'good':'bad'}" role="status">${correct?'✓ Rätt!':'Inte riktigt. Försök igen.'} ${correct?esc(it.why):'Läs den aktuella delen en gång till och välj ett nytt svar.'}</div>`;}return `<div class="question"><h3>${i+1}. ${esc(it.q)}</h3><div class="choices">${it.opts.map((o,j)=>`<button type="button" class="choice ${val===j?'selected':''}" aria-pressed="${val===j}" data-key="${key}" data-choice="${j}">${esc(o)}</button>`).join('')}</div>${fb}</div>`;}).join('');}
function result(items,prefix){let right=items.filter((q,i)=>selections[prefix+i]===q.a).length;return `<div class="note">Du har ${right} av ${items.length} rätt. ${right===items.length?'Bra arbetat! Du kan gå vidare.':'Läs gärna igen och försök med frågorna som ännu inte är rätt.'}</div>`;}
function nav(){return `<div class="actions"><button type="button" class="btn secondary" id="prev" ${section===0?'disabled':''}>← Föregående</button><button type="button" class="btn" id="next" ${section===5?'disabled':''}>Nästa del →</button></div>`;}
function render(){document.getElementById('tabs').innerHTML=sections.map((name,i)=>`<button type="button" class="tab ${section===i?'active':''}" data-tab="${i}" aria-current="${section===i?'step':'false'}">${i+1}. ${name}${completed.has(i)?' ✓':''}</button>`).join('');document.getElementById('progressText').textContent=`Del ${section+1} av 6 · ${sections[section]}`;document.getElementById('bar').style.width=`${(section+1)/6*100}%`;let h='';
if(section===0){h=`<h2>1. Innan du läser</h2><p>Titta på bilden ovan. Vad tror du att berättelsen handlar om? Välj det svar du tycker passar bäst. Här tränar du på att förbereda dig inför läsningen.</p>${questionBlock(before,'b',true)}<div class="note">Det finns inga poäng i den här delen. Det viktiga är att tänka och förbereda sig.</div>`;}
if(section===1){h=`<h2>2. Läs berättelsen</h2><p>Läs texten i din egen takt. Du kan läsa den flera gånger och gå tillbaka till den när du svarar på frågorna.</p>${story}<h3>Ord som kan hjälpa dig</h3><div class="wordlist"><div class="word"><strong>äldreboende</strong><br>En plats där äldre personer bor och får stöd.</div><div class="word"><strong>handledare</strong><br>En person som visar och hjälper dig på jobbet.</div><div class="word"><strong>arbetsuppgift</strong><br>Något du ska göra på arbetet.</div><div class="word"><strong>framsteg</strong><br>När något går bättre än tidigare.</div></div>`;}
if(section===2){h=`<h2>3. Förstå texten</h2><p>Välj ett svar på varje fråga. Du får veta direkt om svaret är rätt. Om du svarar fel kan du prova igen.</p>${questionBlock(comprehension,'c')}${result(comprehension,'c')}<div class="actions"><button class="btn secondary" id="retry" data-prefix="c">Börja om med frågorna</button></div>`;}
if(section===3){h=`<h2>4. Läs ett arbetsschema</h2><p>Samira får ett schema för en arbetsvecka. Läs tabellen och svara på frågorna.</p><table class="schedule"><thead><tr><th>Dag</th><th>Arbetstid</th></tr></thead><tbody><tr><td>Måndag</td><td>07.00–15.00</td></tr><tr><td>Tisdag</td><td>08.00–16.00</td></tr><tr><td>Onsdag</td><td>Ledig</td></tr><tr><td>Torsdag</td><td>07.00–15.00</td></tr><tr><td>Fredag</td><td>09.00–17.00</td></tr></tbody></table>${questionBlock(schedule,'s')}${result(schedule,'s')}<div class="actions"><button class="btn secondary" id="retry" data-prefix="s">Börja om med frågorna</button></div>`;}
if(section===4){h=`<h2>5. Läs mellan raderna</h2><p>Ibland står svaret inte direkt i texten. Då behöver du använda ledtrådar och tänka på vad texten betyder. Gå gärna tillbaka till berättelsen.</p><details><summary><strong>Visa berättelsen igen</strong></summary>${story}</details>${questionBlock(inference,'i')}${result(inference,'i')}<div class="actions"><button class="btn secondary" id="retry" data-prefix="i">Börja om med frågorna</button></div>`;}
if(section===5){const count=[...comprehension.map((q,i)=>selections['c'+i]===q.a),...schedule.map((q,i)=>selections['s'+i]===q.a),...inference.map((q,i)=>selections['i'+i]===q.a)].filter(Boolean).length;h=`<h2>6. Reflektera och avsluta</h2><p>Vad hjälpte dig att förstå texten? Markera de strategier du använde.</p>${['Jag läste texten flera gånger.','Jag använde sammanhanget för att förstå nya ord.','Jag letade efter viktiga ord i frågorna.','Jag kontrollerade mina svar i texten.'].map((t,i)=>`<label style="display:block;margin:12px 0"><input type="checkbox" data-reflect="${i}" ${reflections[i]?'checked':''}> ${t}</label>`).join('')}<h3>Vad har du lärt dig?</h3><p>Skriv gärna en eller två meningar. Det här är din egen reflektion och bedöms inte automatiskt.</p><textarea id="reflection" placeholder="Jag har lärt mig att …">${esc(ownReflection)}</textarea><p class="muted">Din text finns kvar när du byter mellan delarna, så länge sidan är öppen.</p><div class="summary">Ditt resultat: ${count} av 13 rätt på läsförståelsefrågorna.</div><p>Du har tränat på att läsa en berättelse, hitta information i ett schema och dra slutsatser. Bra arbetat!</p><div class="actions"><button class="btn secondary" id="restart">Börja om hela övningen</button></div>`;}
document.getElementById('panel').innerHTML=h+nav();if(section===0||section===1||section===5)completed.add(section);else{const [items,prefix]=section===2?[comprehension,'c']:section===3?[schedule,'s']:[inference,'i'];if(items.every((q,i)=>selections[prefix+i]===q.a))completed.add(section);}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(Number(b.dataset.tab)));document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{selections[b.dataset.key]=Number(b.dataset.choice);render();});document.querySelectorAll('[data-reflect]').forEach(b=>b.onchange=()=>{reflections[b.dataset.reflect]=b.checked;});const ta=document.getElementById('reflection');if(ta)ta.oninput=()=>{ownReflection=ta.value};const retry=document.getElementById('retry');if(retry)retry.onclick=()=>{const prefix=retry.dataset.prefix;Object.keys(selections).filter(k=>k.startsWith(prefix)).forEach(k=>delete selections[k]);completed.delete(section);render();};const restart=document.getElementById('restart');if(restart)restart.onclick=()=>{if(confirm('Vill du radera dina svar och börja om?')){Object.keys(selections).forEach(k=>delete selections[k]);completed.clear();reflections={};ownReflection='';go(0);}};document.getElementById('prev').onclick=()=>go(section-1);document.getElementById('next').onclick=()=>go(section+1);}
function go(i){if(i<0||i>5)return;section=i;render();document.getElementById('tabs').scrollIntoView({behavior:'smooth',block:'start'});}render();
</script></body></html>
