const story=`Samira har nyligen fått jobb på ett äldreboende. Hon är glad eftersom hon länge har velat arbeta med människor. Samtidigt är hon lite nervös. Det är många nya arbetsuppgifter och hon känner inte sina kollegor ännu.

Den första dagen kommer Samira till arbetsplatsen klockan sju på morgonen. Hennes handledare, Maria, visar henne runt och berättar om dagens arbete. Samira får också ett schema där hon kan se vilka dagar hon ska arbeta.

Under förmiddagen hjälper Samira till med frukosten och pratar med de äldre. Hon tycker att arbetet är intressant, men ibland är det svårt att förstå vad kollegorna säger eftersom de pratar snabbt.

På lunchrasten berättar hon det för Maria. ”Du får gärna fråga när du inte förstår”, säger Maria. ”Det är viktigt att du känner dig trygg här.”

Efter några veckor känner Samira sig säkrare. Hon har lärt sig många nya ord och vågar ställa fler frågor. Hon märker också att det blir lättare att förstå kollegorna.

Samira är fortfarande trött efter arbetsdagarna, men hon känner sig stolt över sina framsteg.`;
const groups={2:[['Var arbetar Samira?',['På en skola','På ett äldreboende','I en affär'],1,'Samira arbetar på ett äldreboende.'],['Varför är Samira nervös?',['Hon har nya arbetsuppgifter och kollegor','Hon har glömt sitt schema','Hon måste arbeta på natten'],0,'Allt är nytt och hon känner inte sina kollegor.'],['Vem visar Samira runt första dagen?',['En granne','En boende','Maria'],2,'Maria är Samiras handledare.'],['Vad är svårt för Samira?',['Att hitta till jobbet','Att förstå kollegor som pratar snabbt','Att läsa klockan'],1,'Kollegorna pratar ibland snabbt.'],['Vad händer efter några veckor?',['Samira känner sig säkrare','Samira slutar prata','Samira byter arbete'],0,'Hon vågar fråga mer och förstår bättre.'],['Hur känner Samira sig efter arbetsdagarna?',['Arg','Uttråkad','Trött men stolt'],2,'Hon är trött men stolt över sina framsteg.']],3:[['Vilken dag är Samira ledig?',['Tisdag','Onsdag','Fredag'],1,'Hon är ledig på onsdagen.'],['När börjar Samira på fredagen?',['07.00','08.00','09.00'],2,'På fredagen börjar hon klockan 09.00.'],['Hur många dagar arbetar hon?',['Tre','Fyra','Fem'],1,'Hon arbetar måndag, tisdag, torsdag och fredag.'],['Vilka dagar börjar hon klockan sju?',['Måndag och torsdag','Tisdag och fredag','Måndag och onsdag'],0,'Måndag och torsdag börjar hon 07.00.']],4:[['Varför uppmuntrar Maria Samira att fråga?',['För att Samira ska känna sig trygg','För att hon alltid kommer sent','För att Maria vill gå hem'],0,'Maria vill att Samira ska känna sig trygg.'],['Hur utvecklar Samira sin svenska?',['Hon läser bara böcker','Hon använder språket på arbetet','Hon slutar öva svenska'],1,'Hon lyssnar, pratar och ställer frågor.'],['Varför är Samira trött men ändå nöjd?',['Hon tycker inte om jobbet','Hon behöver inte arbeta','Arbetet kräver energi men hon utvecklas'],2,'Hon ser att hon gör framsteg.']]};
let page=0;const answers={};const names=['Innan du läser','Läs texten','Förstå texten','Läs schemat','Läs mellan raderna','Avslutning'];
function questions(n){return groups[n].map((q,i)=>`<div class="question"><p>${i+1}. ${q[0]}</p>${q[1].map((o,j)=>`<button class="option ${answers[n+'-'+i]===j?'selected':''}" onclick="choose(${n},${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}<div class="feedback ${answers[n+'-'+i]===q[2]?'good':'bad'}">${answers[n+'-'+i]===undefined?'':answers[n+'-'+i]===q[2]?'✓ Rätt! '+q[3]:'Försök igen. Läs texten noggrant.'}</div></div>`).join('')}
function choose(n,i,j){answers[n+'-'+i]=j;render()}
function render(){document.getElementById('tabs').innerHTML=names.map((x,i)=>`<button class="${i===page?'active':''}" onclick="go(${i})">${i+1}. ${x}</button>`).join('');let h='';
if(page===0)h='<h2>1. Innan du läser</h2><p>Titta på bilden. Vad tror du att texten handlar om?</p><p>Fundera på frågorna:</p><ol><li>Var arbetar personerna?</li><li>Vad kan vara svårt när man börjar på ett nytt jobb?</li><li>Vad behöver man veta om sina arbetstider?</li></ol><p class="small">Här finns inga rätt eller fel. Fundera innan du läser.</p>';
if(page===1)h='<h2>2. Läs berättelsen</h2><p>Läs texten i din egen takt. Du kan läsa den flera gånger.</p><div class="story">'+story.split('\n\n').map(p=>'<p>'+p+'</p>').join('')+'</div>';
if(page===2)h='<h2>3. Förstå texten</h2><p>Välj rätt svar. Du får återkoppling direkt och kan försöka igen.</p>'+questions(2);
